# Short-term listen queue — curated priorities, not a rigid timetable.
# Grounded in the technical patterns across an initial batch of EU senior
# full-stack / backend-leaning product-engineering job descriptions.
# This public study queue deliberately contains no private application details.
#
# mode: audio | screen | either
# status: optional override — open | done | skipped
# Otherwise a listen/read/skim/lab/oral/review event marks an item done.
# Source of truth for learning progress: activity.yaml. Do not infer fluency from listening.
#
# Stage 2 is ACTIVE: applications + Interview Lab in parallel with selective listening.
# Listen to warm up; rehearse to prove competence. Labs remain optional.
# React exception: listening alone is insufficient for an independently operated
# framework. Pair SE250 study with small manual implementation/debugging drills.
# The goal is confident explanation and modification without AI completing every step.
# Diversify subjects, skip known material, and pivot when an actual interview arrives.
# Do not postpone mocks until this queue is complete.

goal: >
  Market-aligned interview refresh (Nov 2026): prioritize React/Next.js,
  practical SQL/PostgreSQL, TypeScript/Node runtime depth, backend reliability,
  API contracts, and senior design judgment. Use the existing manuscripts;
  do not create more courses by default. Keep cloud/DevOps, algorithms,
  niche vendor tooling and extra AI theory off the critical path.
  React requires independent hands-on implementation/debugging alongside audio learning.

updated: '2026-11-02'

# Audio-friendly alternates for walks, not an additional required workload.
walk_pack:
- lecture: CS330-L01
  mode: audio
  approx_min_at_1_5x: 33
  why: Relational modeling primer before SQL fluency if useful
- lecture: SE320-L01
  mode: either
  why: Backend service boundaries and ownership, matched to product-company interviews
- lecture: CS430-L01
  mode: either
  why: Partial failure, retries and idempotency — repeated backend interview themes
- lecture: SE330-L02
  mode: audio
  why: Architecture patterns and their costs; good spoken design rehearsal

# Priority order is a preference, not a completion contract.
# Large manuscripts can be listened to selectively (intuition + needed sections).
# React micro-practice after SE250-L01/L02/L03:
# - Independently implement a small searchable/list + editor with controlled inputs.
# - Fix a stale closure, effect cleanup or race in unfamiliar React code.
# - Explain each useState/useEffect choice and verify loading/error/empty behavior.
# No need to ban AI entirely: first reason and attempt yourself, then review with AI.
# This is a targeted diagnostic exception, not a blanket requirement to do all labs.
