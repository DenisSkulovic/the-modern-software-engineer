# Short-term listen queue — curated picks, not a calendar and not auto-generated.
# Order is preference among open items; skip or reshuffle freely.
# Diversify subjects across sessions (university-style), don't binge one course.
#
# mode: audio | screen | either
#   audio  — prose carries without staring at fences (headphones / walking OK)
#   screen — code/diagrams matter; listen while looking, or read
#   either — fine either way
# status: optional override — open | done | skipped
#   Otherwise a listen/read/skim/lab/oral/review event marks the item done.
#
# Orientation: book/engineering-decision-map.md (architecture joints across the catalogue).
# Labs optional. Interview Lab tests understanding. Activity log is source of truth for done.

